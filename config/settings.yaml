# Dealfinder settings.
#
# Everything the app assumes lives in this file, so any of it can be changed without touching
# code. To change something just for yourself, create config/settings.local.yaml containing only
# the keys you want different; it is merged over this file and is git-ignored.
#
# Shares and rates are fractions: 0.06 means 6%. Money is dollars.

buy_box:
  property_types: [fourplex]     # any of: sfr, condo, townhouse, duplex, triplex, fourplex, multifamily_5plus
  states: all                    # all = the 48 contiguous states + DC, or a list such as [OH, IN, MI]
  max_price: 750000              # null = no cap
  min_unit_confidence: medium    # high | medium | low
  ranking_scenario: conv_investor
  targets:                       # null switches a target off
    min_cash_flow_per_door_month: 100
    min_coc: 0.06
    min_dscr: 1.20

underwriting:
  vacancy:
    floor: 0.06                  # vacancy = max(floor, county rental vacancy + county_add)
    county_add: 0.01
  management:
    mode: self                   # self | manager
    self_pct: 0.0                # share of EGI when you manage the building yourself
    manager_pct: 0.09            # share of EGI with a property manager; always used for the
                                 # "moved out" view of a house hack
  repairs_and_reserves:          # each a share of GSR, picked by year built
    - {built_before: 1950, repairs_pct: 0.10, reserves_pct: 0.10}
    - {built_before: 1980, repairs_pct: 0.08, reserves_pct: 0.08}
    - {built_before: 2000, repairs_pct: 0.07, reserves_pct: 0.07}
    - {built_before: null, repairs_pct: 0.05, reserves_pct: 0.05}
  utilities:
    paid_by: unknown             # owner | tenant | unknown (unknown charges the owner and flags it)
    owner_cost_per_unit_month: 75
  insurance:
    per_unit_year: 900           # used when a state is missing from insurance_by_state.csv
    high_risk_multiplier: 1.5    # applied in counties with a high FEMA risk rating
  flood_insurance_per_unit_year: 750   # placeholder, charged only inside a flood zone
  misc_per_unit_year: 300
  closing_cost_pct: 0.03
  rehab_per_unit:                # picked by condition flags, or set a dollar amount per deal
    none: 0
    light: 5000
    heavy: 20000

when_unknown:                    # pessimistic stand-ins; every use is flagged in the output
  tax_rate: 0.025
  vacancy_rate: 0.10
  base_rate: 0.075
  year_built: 1900               # falls in the oldest band above
  high_hazard_county: true       # true applies the insurance multiplier when the county rating is unknown
  in_flood_zone: false           # false flags "not checked" without charging flood insurance

hold:
  years: 5
  rent_growth: 0.03              # per year, from year 2
  expense_growth: 0.03           # per year on dollar-based expenses, from year 2
  appreciation: 0.03
  selling_cost_pct: 0.06

sensitivity:                     # each case moves one thing; add, remove or edit freely
  - {name: "Rate +1 pt", rate_delta: 0.01}
  - {name: "Rate -1 pt", rate_delta: -0.01}
  - {name: "Rents -10%", rent_factor: 0.90}
  - {name: "Vacancy +5 pts", vacancy_delta: 0.05}
  - {name: "Insurance +50%", insurance_factor: 1.5}
  - {name: "Taxes +25%", tax_factor: 1.25}

market:
  sources:                       # switch any free data source off here
    fred: true                   # mortgage rate
    hud_fmr: true                # Fair Market Rents; needs HUD_API_TOKEN
    acs: true                    # county tax rate and rental vacancy; needs CENSUS_API_KEY
    zori: true                   # Zillow rent index, used as a cross-check and for rent growth
    nri: true                    # FEMA county hazard rating
  acs_year: 2024                 # last year of the ACS 5-year window (2020-2024)
  high_risk_ratings: [Relatively High, Very High]   # these get the insurance multiplier
  fmr_extra_bedroom_pct: 0.15    # HUD's rule: each bedroom past four adds this share of the 4BR rent
  rent_check_tolerance: 0.25     # flag rents this far above Zillow's typical rent for the area
  cache_days:                    # how long a downloaded copy is reused before refreshing
    fred: 1
    hud_fmr: 30
    acs: 365
    zori: 30
    nri: 180

sources:                         # where listings come from
  rentcast: {enabled: true}      # licensed API; needs RENTCAST_API_KEY
  csv: {enabled: true}           # your own files: MLS exports, LoopNet, wholesaler lists
  homeharvest: {enabled: false}  # scraper, off by default
  apify_zillow: {enabled: false} # scraper, off by default

budgets:
  rentcast:
    plan: developer              # which row of rentcast_plans you are on
    monthly_request_cap: 50      # hard stop: no request is sent past this (null = no cap)
    billing_cycle_day: 1         # day of the month your RentCast plan renews

rentcast_plans:                  # used only to price a run in --dry-run
  developer: {monthly_fee: 0, included: 50, overage: 0.20}
  foundation: {monthly_fee: 74, included: 1000, overage: 0.06}
  growth: {monthly_fee: 199, included: 5000, overage: 0.03}
  scale: {monthly_fee: 449, included: 25000, overage: 0.015}

sweep:
  page_size: 500                 # RentCast's maximum; every page is one billed request
  filter_by_max_price: true      # ask only for listings at or under the buy box price
  daily_days_old: 2              # daily sweep: listings that came on in the last N days
  page_cache_hours: 12           # a repeat run within this window rereads pages from disk for free
  completeness_tolerance: 0.02   # weekly: a state counts as fully fetched within this share of
                                 # the reported total; only then are missing listings marked off-market
  missed_sweeps_before_off_market: 1   # full sweeps in a row a listing must be missing from;
                                 # 2 guards against a listing skipped while results reshuffle

dedupe:
  radius_m: 30                   # same property if this close and...
  price_tolerance: 0.05          # ...priced within this share of each other

classify:
  rehab_by_flag:                 # listing tags (config/keywords.yaml) that add a rehab budget,
    light: [tlc, needs_work]     # using underwriting.rehab_per_unit for the level
    heavy: [as_is, fixer, cash_only]
  property_record_cache_days: 180   # RentCast property records (unit count, tax bill) are reused this long
  llm:                           # optional reading of descriptions by Claude; needs ANTHROPIC_API_KEY
    enabled: false
    model: claude-haiku-5-5
    effort: low
    max_tokens: 4000
    only_below_confidence: high  # ask only when the rules are less sure than this: high | medium
    max_calls_per_run: 200

funnel:                          # how listings are narrowed down before money is spent on them
  stage1:                        # every listing, free data only. A listing is kept if EITHER holds:
    min_cash_flow_per_door_month: -100   # cash flow per door is at least this
    min_rent_to_price: 0.007     # monthly rent is at least this share of the price
  stage2:                        # only the listings stage 1 keeps
    rent_estimates: true         # RentCast rent estimate per unit layout; one billed request each
    max_rent_requests_per_run: 20
    rent_comp_count: 10          # comparable rentals behind each estimate, 5 to 25
    rent_cache_days: 60          # a rent estimate is reused this long
    flood_zones: true            # FEMA flood map lookup by coordinates; free
    flood_cache_days: 365
    llm: true                    # let Claude read uncertain descriptions, if classify.llm.enabled

scoring:                         # deal score, 0 to 100; weights add up to 100
  cash_flow_per_door: {weight: 25, zero_at: 0, full_at: 300}      # $ per door per month
  coc: {weight: 20, zero_at: 0, full_at: 0.12}                    # cash-on-cash return
  dscr: {weight: 15, zero_at: 1.0, full_at: 1.50}
  cap_rate_vs_county: {weight: 10, zero_at: 0, full_at: 0.02}     # cap rate minus the county median
  price_per_door_vs_county: {weight: 10, zero_at: 0, full_at: 0.30}   # share below the county median
  rent_upside: {weight: 10, zero_at: 0, full_at: 0.20}            # market rent over rent in place
  seller_motivation:
    weight: 10
    days_on_market: {points: 4, full_at: 120}
    price_cut: {points: 4, full_at: 0.10}     # total cut from the first asking price
    tag_points: 2                             # for each tag or listing type below that applies
    tags: [motivated, estate_sale, bring_all_offers, as_is, cash_only]
    listing_types: [Foreclosure, Short Sale]
  county_sample_min: 5           # fewer underwritten listings than this in a county: no county points
  penalties: {flood_zone: 5, high_hazard: 5}
  confidence_multiplier: {high: 1.0, medium: 0.85, low: 0.7}     # by unit-count confidence
  grades: {A: 80, B: 65, C: 50, D: 35}       # lowest score for each grade; below D is F

alerts:                          # one digest per run; nothing is ever sent twice
  enabled: true
  channels:                      # each one also needs its key in .env
    discord: true                # DISCORD_WEBHOOK_URL
    slack: true                  # SLACK_WEBHOOK_URL
    email: true                  # SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD, ALERT_EMAIL_TO
  grades: [A, B]                 # a deal inside the buy box with one of these grades is worth an alert
  starred_price_cut_pct: 0.03    # a starred property's price falls by at least this much at once
  max_deals_per_section: 10      # longer lists are cut, with a count of the rest

schedule:                        # for `dealfinder schedule`; times are this computer's local time
  daily_at: "07:00"
  weekly_on: sunday
  weekly_at: "06:00"

scrapers:                        # read only when a scraper source above is switched on
  min_seconds_between_requests: 10   # one request at a time, with this pause between them
  homeharvest:                   # the HomeHarvest library, which reads Realtor.com
    locations: []                # e.g. ["Columbus, OH", "43215"]; empty = each state asked for
    max_results_per_location: 400
    extra_property_data: false   # true asks once more per listing: slower, and more load on the site
  apify_zillow:                  # a paid Apify actor; needs APIFY_TOKEN
    actor: maxcopell~zillow-scraper
    search_urls: []              # Zillow search URLs that contain ?searchQueryState=...
    extraction_method: PAGINATION_WITH_ZOOM_IN
    results_limit: 200           # per search URL; Apify bills each result
    price_per_result: 0.0023     # Apify's free-tier price in dollars, used for the cost estimate
    monthly_result_cap: 1000     # hard stop on results per calendar month; null removes it

financing:
  loan_limit_year: 2026          # picks config/loan_limits/<year>.yaml
  base_rate_manual: null         # your own base rate, used instead of the 30-year average
  presets:
    # Each loan's rate is its rate_quote when set, otherwise base rate + rate_spread.
    # Spreads and mortgage-insurance rates below are placeholders. Set enabled: false to hide a loan.
    fha_house_hack:
      enabled: true
      label: FHA 3.5% down, house hack
      program: fha
      owner_occupied: true
      min_units: 2
      max_units: 4
      down_payment_pct: 0.035
      term_years: 30
      rate_spread: 0.0
      rate_quote: null
      upfront_mi_pct: 0.0175     # financed into the loan
      annual_mi:                 # loans over 15 years, charged monthly on the base loan
        - {max_base_loan: 726200, ltv_above: 0.95, rate_above: 0.0055, rate_at_or_below: 0.0050}
        - {max_base_loan: null, ltv_above: 0.95, rate_above: 0.0075, rate_at_or_below: 0.0070}
      loan_limit: fha            # fha | conforming_baseline | conforming_county | none
      self_sufficiency: {factor: 0.75, units: [3, 4]}
    conv_owner_5:
      enabled: true
      label: Conventional 5% down, owner-occupied
      program: conventional
      owner_occupied: true
      min_units: 2
      max_units: 4
      down_payment_pct: 0.05
      term_years: 30
      rate_spread: 0.0025
      rate_quote: null
      annual_mi:                 # private mortgage insurance while the loan is over 80% of price
        - {max_base_loan: null, ltv_above: 0.80, rate_above: 0.0060, rate_at_or_below: 0.0}
      loan_limit: conforming_baseline   # standard amounts only, no high-balance
      reserves_months: 6
    conv_investor:
      enabled: true
      label: Conventional 25% down, investor
      program: conventional
      min_units: 1
      max_units: 4
      down_payment_pct: 0.25
      term_years: 30
      rate_spread: 0.0075
      rate_quote: null
      loan_limit: conforming_county
    dscr:
      enabled: true
      label: DSCR loan, 25% down
      program: dscr
      min_units: 1
      max_units: 4
      down_payment_pct: 0.25
      term_years: 30
      rate_spread: 0.0125
      rate_quote: null
      lender_dscr: {min: 1.00, best: 1.25}
    commercial:
      enabled: true
      label: Commercial loan, 5+ units
      program: commercial
      min_units: 5
      max_units: null
      down_payment_pct: 0.25
      term_years: 25             # amortization
      rate_spread: 0.015
      rate_quote: null
      lender_dscr: {min: 1.25, best: 1.25}
    cash:
      enabled: true
      label: All cash
      program: cash
      min_units: 1
      max_units: null
      down_payment_pct: 1.0
      term_years: 30
      rate_spread: 0.0
