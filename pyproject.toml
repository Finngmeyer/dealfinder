[project]
name = "dealfinder"
version = "0.1.0"
description = "Local-first finder and underwriter for small multifamily deals"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydeck>=0.9",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.scripts]
dealfinder = "dealfinder.cli:app"

[project.optional-dependencies]
llm = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "anthropic>=1.0",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]  # class-level constants in test classes are never mutated

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
